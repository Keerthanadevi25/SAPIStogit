name: Sync Integration Suite package and iFlow to Git

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  PACKAGE_NAME: "Test_Package"
  IFLOW_NAME: "Test_Iflow"

  GIT_AUTHOR_NAME: "Integration Suite Sync Bot"
  GIT_AUTHOR_EMAIL: "no-reply@example.com"

  TARGET_BRANCH: "main"
  SYNC_DIR: "integration-suite-content"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get OAuth token
        id: token
        env:
          TOKEN_URL: ${{ secrets.DEV_TOKEN_URL }}
          CLIENT_ID: ${{ secrets.DEV_CLIENT_ID }}
          CLIENT_SECRET_B64: ${{ secrets.DEV_CLIENT_SECRET_B64 }}
        run: |
          set -euo pipefail

          CLIENT_SECRET="$(printf '%s' "$CLIENT_SECRET_B64" | base64 --decode)"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            "${TOKEN_URL}?grant_type=client_credentials" \
            --user "${CLIENT_ID}:${CLIENT_SECRET}" \
            --header "Accept: application/json")"

          ACCESS_TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain an OAuth access token." >&2
            printf '%s' "$RESPONSE" | jq . >&2 || printf '%s\n' "$RESPONSE" >&2
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Download package and iFlow metadata
        env:
          IS_URL: ${{ secrets.DEV_HOST }}
          ACCESS_TOKEN: ${{ steps.token.outputs.ACCESS_TOKEN }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          IFLOW_NAME: ${{ env.IFLOW_NAME }}
          SYNC_DIR: ${{ env.SYNC_DIR }}
        run: |
          set -euo pipefail

          IS_URL="${IS_URL%/}"
          mkdir -p "$SYNC_DIR"

          api_get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --header "Accept: application/json" \
              "$1"
          }

          LIST_PKGS_RESPONSE="$(api_get "$IS_URL/api/v1/IntegrationPackages")"

          PKG_ID="$(printf '%s' "$LIST_PKGS_RESPONSE" | jq -r \
            --arg name "$PACKAGE_NAME" '
              .d.results[]
              | select(.Name == $name)
              | .Id
            ' | head -n 1)"

          if [ -z "$PKG_ID" ] || [ "$PKG_ID" = "null" ]; then
            echo "Package '$PACKAGE_NAME' was not found." >&2
            echo "Available packages:" >&2
            printf '%s' "$LIST_PKGS_RESPONSE" | jq -r '.d.results[].Name' >&2
            exit 1
          fi

          echo "Found package ID: $PKG_ID"

          PKG_RESPONSE="$(api_get "$IS_URL/api/v1/IntegrationPackages('$PKG_ID')")"
          printf '%s' "$PKG_RESPONSE" | jq . > "$SYNC_DIR/${PACKAGE_NAME}-package.json"

          IFLOWS_RESPONSE="$(api_get \
            "$IS_URL/api/v1/IntegrationPackages('$PKG_ID')/IntegrationDesigntimeArtifacts")"

          printf '%s' "$IFLOWS_RESPONSE" | jq . \
            > "$SYNC_DIR/${PACKAGE_NAME}-iflows-list.json"

          ARTIFACT_ID="$(printf '%s' "$IFLOWS_RESPONSE" | jq -r \
            --arg name "$IFLOW_NAME" '
              .d.results[]
              | select(.Name == $name)
              | .Id
            ' | head -n 1)"

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "iFlow '$IFLOW_NAME' was not found in package '$PACKAGE_NAME'." >&2
            echo "Available iFlows:" >&2
            printf '%s' "$IFLOWS_RESPONSE" | jq -r '.d.results[].Name' >&2
            exit 1
          fi

          echo "Found iFlow artifact ID: $ARTIFACT_ID"

          IFLOW_DIR="$SYNC_DIR/$PACKAGE_NAME"
          mkdir -p "$IFLOW_DIR"

          # Save the iFlow object already returned by the successful package listing.
          printf '%s' "$IFLOWS_RESPONSE" | jq \
            --arg id "$ARTIFACT_ID" '
              .d.results[]
              | select(.Id == $id)
            ' > "$IFLOW_DIR/${IFLOW_NAME}.json"

          if [ ! -s "$IFLOW_DIR/${IFLOW_NAME}.json" ]; then
            echo "Failed to write iFlow metadata." >&2
            exit 1
          fi

      - name: Configure Git with PAT
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GIT_PAT" ]; then
            echo "ERROR: Repository secret GIT_PAT is empty or unavailable." >&2
            exit 1
          fi

          git config user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"

          git remote set-url origin \
            "https://x-access-token:${GIT_PAT}@github.com/${{ github.repository }}.git"

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync package '${{ env.PACKAGE_NAME }}' iFlow '${{ env.IFLOW_NAME }}' from Integration Suite"
          git push origin "HEAD:${{ env.TARGET_BRANCH }}"
