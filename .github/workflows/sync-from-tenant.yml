name: Sync Integration Suite package and iFlow to Git

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  PACKAGE_NAME: "Test_Package"
  IFLOW_NAME: "Test_Iflow"

  GIT_AUTHOR_NAME: "Integration Suite Sync Bot"
  GIT_AUTHOR_EMAIL: "no-reply@example.com"

  TARGET_BRANCH: "main"
  SYNC_DIR: "integration-suite-content"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Get OAuth token
        id: token
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET_B64 }}"

          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          RESPONSE=$(curl -s -X POST "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Accept: application/json")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to get access token. Response:" >&2
            echo "$RESPONSE" | jq . >&2
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Find package and iFlow, download content
        run: |
          IS_URL="${{ secrets.DEV_HOST }}"
          ACCESS_TOKEN="${{ steps.token.outputs.ACCESS_TOKEN }}"
          PACKAGE_NAME="${{ env.PACKAGE_NAME }}"
          IFLOW_NAME="${{ env.IFLOW_NAME }}"
          SYNC_DIR="${{ env.SYNC_DIR }}"

          AUTH_HEADER="Authorization: Bearer $ACCESS_TOKEN"
          ACCEPT_HEADER="Accept: application/json"

          mkdir -p "$SYNC_DIR"

          LIST_PKGS_RESPONSE=$(curl -s -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$IS_URL/api/v1/IntegrationPackages")

          PKG_ID=$(echo "$LIST_PKGS_RESPONSE" | jq -r --arg name "$PACKAGE_NAME" '
            .d.results[]
            | select(.Name == $name)
            | .Id
          ' | head -n 1)

          if [ -z "$PKG_ID" ] || [ "$PKG_ID" = "null" ]; then
            echo "Package '$PACKAGE_NAME' not found." >&2
            echo "Available package names:" >&2
            echo "$LIST_PKGS_RESPONSE" | jq -r '.d.results[].Name' >&2
            exit 1
          fi

          echo "Found package ID: $PKG_ID"

          PKG_RESPONSE=$(curl -s -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$IS_URL/api/v1/IntegrationPackages('$PKG_ID')")
          echo "$PKG_RESPONSE" | jq . > "$SYNC_DIR/${PACKAGE_NAME}-package.json"

          IFLOWS_RESPONSE=$(curl -s -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$IS_URL/api/v1/IntegrationPackages('$PKG_ID')/IntegrationDesigntimeArtifacts")

          ARTIFACT_ID=$(echo "$IFLOWS_RESPONSE" | jq -r --arg name "$IFLOW_NAME" '
            .d.results[]
            | select(.Name == $name)
            | .Id
          ' | head -n 1)

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "iFlow '$IFLOW_NAME' not found in package '$PACKAGE_NAME'." >&2
            echo "Available iFlow names in this package:" >&2
            echo "$IFLOWS_RESPONSE" | jq -r '.d.results[].Name' >&2
            exit 1
          fi

          echo "Found iFlow artifact ID: $ARTIFACT_ID"

          echo "$IFLOWS_RESPONSE" | jq . > "$SYNC_DIR/${PACKAGE_NAME}-iflows-list.json"

          IFLOW_DETAIL_RESPONSE=$(curl -s -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$IS_URL/api/v1/IntegrationDesigntimeArtifacts('$ARTIFACT_ID')")

          IFLOW_DIR="$SYNC_DIR/$PACKAGE_NAME"
          mkdir -p "$IFLOW_DIR"

          echo "$IFLOW_DETAIL_RESPONSE" | jq . > "$IFLOW_DIR/${IFLOW_NAME}.json"

      - name: Configure Git
        run: |
          git config user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git remote set-url origin "https://x-access-token:${{ secrets.GIT_PAT }}@github.com/${{ github.repository }}.git"

      - name: Commit and push changes
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync package '${{ env.PACKAGE_NAME }}' iFlow '${{ env.IFLOW_NAME }}' from Integration Suite"
            git push origin "${{ env.TARGET_BRANCH }}"
          else
            echo "No changes to commit."
          fi
