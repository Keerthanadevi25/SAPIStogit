- name: Commit and push changes
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          set -euo pipefail

          SIGNIFICANT_CHANGES=$(git status --porcelain \
            "extracted/${PACKAGE_NAME}" || true)

          if [ -z "$SIGNIFICANT_CHANGES" ]; then
            echo "No iFlow source changes detected."
            exit 0
          fi

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # --- Build a human-readable summary, split into two buckets ---
          # Bucket 1: the actual logic — flow definitions and scripts
          FLOW_CHANGES="$(git diff --staged --stat -- '*.iflw' '*.groovy' '*.mmap' '*.xsl' '*.xslt' || true)"

          # Bucket 2: everything else — CPI's auto-regenerated metadata
          OTHER_CHANGES="$(git diff --staged --stat -- . \
            ':!*.iflw' ':!*.groovy' ':!*.mmap' ':!*.xsl' ':!*.xslt' || true)"

          echo "=========================================="
          echo "Flow / script changes (the real content):"
          echo "=========================================="
          if [ -n "$FLOW_CHANGES" ]; then
            echo "$FLOW_CHANGES"
          else
            echo "(none — only metadata changed this run)"
          fi
          echo ""
          echo "=========================================="
          echo "Metadata-only changes (expected noise):"
          echo "=========================================="
          if [ -n "$OTHER_CHANGES" ]; then
            echo "$OTHER_CHANGES"
          else
            echo "(none)"
          fi

          # --- Build the commit message body from the same two buckets ---
          COMMIT_MSG_FILE="$(mktemp)"
          {
            echo "chore: sync package ${PACKAGE_NAME} from Integration Suite"
            echo ""
            echo "Flow/script changes:"
            if [ -n "$FLOW_CHANGES" ]; then
              echo "$FLOW_CHANGES"
            else
              echo "(none — metadata only)"
            fi
            echo ""
            echo "Metadata-only changes:"
            if [ -n "$OTHER_CHANGES" ]; then
              echo "$OTHER_CHANGES"
            else
              echo "(none)"
            fi
          } > "$COMMIT_MSG_FILE"

          git commit -F "$COMMIT_MSG_FILE"
          rm -f "$COMMIT_MSG_FILE"

          git push origin HEAD:${{ env.TARGET_BRANCH }}
