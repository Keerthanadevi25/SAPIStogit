name: Sync Integration Suite Package to Git

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  PACKAGE_NAME: "Test_Package"

  GIT_AUTHOR_NAME: "Integration Suite Sync Bot"
  GIT_AUTHOR_EMAIL: "no-reply@example.com"

  TARGET_BRANCH: "main"
  SYNC_DIR: "integration-suite-content"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get OAuth token
        id: token
        env:
          TOKEN_URL: ${{ secrets.DEV_TOKEN_URL }}
          CLIENT_ID: ${{ secrets.DEV_CLIENT_ID }}
          CLIENT_SECRET_B64: ${{ secrets.DEV_CLIENT_SECRET_B64 }}
        run: |
          set -euo pipefail

          CLIENT_SECRET="$(printf '%s' "$CLIENT_SECRET_B64" | base64 --decode)"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            "${TOKEN_URL}?grant_type=client_credentials" \
            --user "${CLIENT_ID}:${CLIENT_SECRET}" \
            --header "Accept: application/json")"

          ACCESS_TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain OAuth token."
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Download package and all iFlows
        env:
          IS_URL: ${{ secrets.DEV_HOST }}
          ACCESS_TOKEN: ${{ steps.token.outputs.ACCESS_TOKEN }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          SYNC_DIR: ${{ env.SYNC_DIR }}
        run: |
          set -euo pipefail

          IS_URL="${IS_URL%/}"

          mkdir -p "$SYNC_DIR"

