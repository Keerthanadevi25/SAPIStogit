name: Sync SAP Integration Content to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # Runs every 6 hours

jobs:
  sync-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Install jq & unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Authenticate & Download Integration Content
        env:
          TOKEN_URL: ${{ secrets.DEV_TOKEN_URL }}
          CLIENT_ID: ${{ secrets.DEV_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DEV_CLIENT_SECRET }}
          API_URL: ${{ secrets.DEV_HOST }}
        run: |
          echo "Fetching OAuth Token..."
          ACCESS_TOKEN=$(curl -s --location \
            --request POST "$TOKEN_URL" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r '.access_token')

          echo "Token received."

          mkdir -p package/Test_Package/iflows

          echo "Fetching list of iFlows..."
          curl -s --location "$API_URL/IntegrationDesigntimeArtifacts" \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Accept: application/json" > artifacts.json

          for ARTIFACT in $(jq -r '.d.results[].Id' artifacts.json); do
            echo "Downloading artifact: $ARTIFACT"

            curl -s --location "$API_URL/IntegrationDesigntimeArtifacts('$ARTIFACT')/\$value" \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --output "package/mypackage/iflows/$ARTIFACT.zip"

            unzip -o "package/mypackage/iflows/$ARTIFACT.zip" -d "package/mypackage/iflows/$ARTIFACT"
          done

      - name: Commit & Push Changes
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git add .
          git commit -m "Auto-sync from SAP BTP Cloud Integration" || echo "No changes to commit"
          git push origin developer
