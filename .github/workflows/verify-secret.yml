name: Verify DEV_CLIENT_SECRET

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Write secret to file
        run: |
          # Use printf with %s to avoid any interpretation
          printf '%s\n' "${{ secrets.DEV_CLIENT_SECRET }}" > client_secret.txt

      - name: Upload secret as artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-secret
          path: client_secret.txt
          retention-days: 1
