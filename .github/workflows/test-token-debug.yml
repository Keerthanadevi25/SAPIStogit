name: Debug All Credentials

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show all credentials
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET }}"
          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          # Use printf to avoid any masking or interpretation
          printf '%s\n' "=== TOKEN_URL ==="
          printf '%s\n' "$TOKEN_URL"
          printf '%s\n' "=== CLIENT_ID ==="
          printf '%s\n' "$CLIENT_ID"
          printf '%s\n' "=== CLIENT_SECRET ==="
          printf '%s\n' "$CLIENT_SECRET"
          printf '%s\n' "=== END ==="
