name: Debug All Credentials

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show all credentials
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET_B64 }}"
          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          echo "=== TOKEN_URL ==="
          echo "$TOKEN_URL"
          echo "=== CLIENT_ID ==="
          echo "$CLIENT_ID"
          echo "=== CLIENT_SECRET ==="
          echo "$CLIENT_SECRET"
          echo "=== END ==="
