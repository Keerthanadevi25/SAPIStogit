name: Debug All Credentials (Hashed)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show hashed credentials
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET }}"
          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          # Compute SHA256 hashes
          TOKEN_URL_HASH=$(echo -n "$TOKEN_URL" | sha256sum | awk '{print $1}')
          CLIENT_ID_HASH=$(echo -n "$CLIENT_ID" | sha256sum | awk '{print $1}')
          CLIENT_SECRET_HASH=$(echo -n "$CLIENT_SECRET" | sha256sum | awk '{print $1}')

          echo "TOKEN_URL_HASH=$TOKEN_URL_HASH"
          echo "CLIENT_ID_HASH=$CLIENT_ID_HASH"
          echo "CLIENT_SECRET_HASH=$CLIENT_SECRET_HASH"
