name: Test Token (Base64 Secret)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET_B64 }}"

          # Decode base64 to get the real secret
          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          echo "Calling: $TOKEN_URL?grant_type=client_credentials"

          RESPONSE=$(curl -s -X POST "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Accept: application/json")

          echo "Response:"
          echo "$RESPONSE" | jq .
