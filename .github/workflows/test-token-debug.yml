name: Test XSUAA Token Debug

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Debug full values
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET="${{ secrets.DEV_CLIENT_SECRET }}"

          echo "TOKEN_URL=$TOKEN_URL"
          echo "CLIENT_ID=$CLIENT_ID"
          echo "CLIENT_SECRET (first 10)=${CLIENT_SECRET:0:10}"
          echo "CLIENT_SECRET (last 10)=${CLIENT_SECRET: -10}"

      - name: Get token
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET="${{ secrets.DEV_CLIENT_SECRET }}"

          RESPONSE=$(curl -s -X POST "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Accept: application/json")

          echo "Response:"
          echo "$RESPONSE" | jq .
