name: Debug Secret Lengths

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show lengths
        run: |
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET_B64 }}"
          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          echo "B64 length: ${#CLIENT_SECRET_B64}"
          echo "Decoded length: ${#CLIENT_SECRET}"
          echo "Decoded (hex):"
          echo -n "$CLIENT_SECRET" | xxd
