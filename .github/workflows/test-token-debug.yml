name: Debug Secret Lengths (Plain)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show lengths
        run: |
          CLIENT_SECRET="${{ secrets.DEV_CLIENT_SECRET }}"

          echo "Decoded length: ${#CLIENT_SECRET}"
          echo "Decoded (hex):"
          echo -n "$CLIENT_SECRET" | xxd
