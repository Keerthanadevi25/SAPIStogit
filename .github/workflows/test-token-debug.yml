name: Test Token Final

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get token with debug
        run: |
          TOKEN_URL="${{ secrets.DEV_TOKEN_URL }}"
          CLIENT_ID="${{ secrets.DEV_CLIENT_ID }}"
          CLIENT_SECRET_B64="${{ secrets.DEV_CLIENT_SECRET_B64 }}"

          CLIENT_SECRET=$(echo "$CLIENT_SECRET_B64" | base64 -d)

          echo "Calling: $TOKEN_URL?grant_type=client_credentials"
          echo "Client ID: $CLIENT_ID"

          RESPONSE=$(curl -v -X POST "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Accept: application/json" 2>&1)

          echo "Full curl output:"
          echo "$RESPONSE"
